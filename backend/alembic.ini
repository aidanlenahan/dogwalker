[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url comes from app settings (DOGWALKER_DATABASE_URL), see alembic/env.py

[post_write_hooks]
hooks = ruff_fmt
ruff_fmt.type = exec
ruff_fmt.executable = %(here)s/.venv/bin/ruff
ruff_fmt.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
level = NOTSET
formatter = generic
args = (sys.stderr,)
class = StreamHandler

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
